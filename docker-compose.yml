services:
  midnight-node:
    image: midnightntwrk/midnight-node:0.22.5
    ports:
      - "9944:9944"
    environment:
      CFG_PRESET: "dev"
    restart: unless-stopped

  indexer:
    image: midnightntwrk/indexer-standalone:4.0.1
    ports:
      - "8088:8088"
    volumes:
      - ./indexer-config.yaml:/opt/indexer-standalone/config.yaml:ro
    depends_on:
      - midnight-node
    restart: unless-stopped

  proof-server:
    image: midnightntwrk/proof-server:8.0.3
    ports:
      - "6300:6300"
    command: ["midnight-proof-server", "-v"]
    restart: unless-stopped
